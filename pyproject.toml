[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-lab"
version = "0.2.0"
description = "Native embedded Qwen hierarchy and bounded continuous-codec training"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-only"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
cpu = ["torch==2.13.0", "transformers==5.15.0"]
upstream = ["transformers==5.15.0"]
prepare = ["pyarrow==23.0.0"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.14.14"]

[project.scripts]
ncm = "ncm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
markers = ["integration: bounded native production-stage integration", "cuda: optional tiny native CUDA kernel validation"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
