[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-lab"
version = "0.1.0"
description = "Reproducible progressive-query speculative drafting research"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-only"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
cpu = ["torch==2.13.0", "transformers==5.15.0"]
upstream = ["transformers==5.15.0"]
prepare = ["pyarrow==23.0.0"]
scoring = ["numpy==2.4.1", "scipy==1.17.0", "pandas==3.0.0", "sympy==1.14.0", "tqdm==4.70.0"]
analysis = [
    "matplotlib==3.10.7",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.14.14"]

[project.scripts]
ncm = "ncm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ncm_lab.vendor" = ["*.txt", "*.json"]
"ncm_lab.vendor.dflash" = ["LICENSE.txt"]
"ncm_lab.vendor.dcore" = ["LICENSE.txt"]
"ncm_lab.vendor.finqa" = ["LICENSE.txt"]
"ncm_lab.vendor.tatqa" = ["LICENSE.txt"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
markers = ["integration: bounded CPU integration", "cuda: optional GPU parity", "isolation: requires a verified code sandbox"]

[tool.ruff]
line-length = 110
exclude = ["src/ncm_lab/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
