name: Native CPU correctness
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - run: uv sync --locked --python 3.12 --extra cpu --extra prepare --extra monitoring --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync ncm validate --config configs/validation/cpu_native.yaml
      - run: uv run --no-sync ncm prepare --config configs/validation/real_pilot.yaml --plan-only
      - run: uv run --no-sync ncm monitor doctor
