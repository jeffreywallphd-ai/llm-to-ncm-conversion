name: CPU correctness
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - run: uv sync --locked --python 3.12 --extra cpu --extra scoring --extra prepare --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync ncm data check
      - run: uv run --no-sync ncm smoke
      - run: uv run --no-sync ncm experiment plan --id ACL-001 --profile spark
      - run: uv run --no-sync ncm prepare --profile spark --dry-run
      - run: uv run --no-sync ncm publication export --study acl --anonymize --output publications/exports/acl-review.zip
